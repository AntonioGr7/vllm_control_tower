[project]
name = "vllm-control-tower"
version = "0.1.0"
description = "Terminal control tower for vLLM: YAML configs, a TUI to serve/stop them, and memory/throughput estimates."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "nvidia-ml-py>=13.615.71",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "typer>=0.27.3",
]

[project.optional-dependencies]
vllm = ["vllm"]

[project.scripts]
vct = "vllm_control_tower.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_control_tower"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM117"]
